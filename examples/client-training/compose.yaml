# Optional client-training sandbox: a self-contained stack with five synthetic tenants.
# It is separate from the standard stack (root compose.yaml): own project name, images,
# volumes, network, ports, session cookie and database. See README.md in this folder.
#
# Start it with `bash examples/client-training/scripts/setup.sh` (it supplies --env-file
# .env.local and the project name). Running `docker compose -f examples/client-training/compose.yaml`
# directly also works; every variable below has a safe local default.
#
# Host ports are bound to 127.0.0.1 only; nothing is exposed to the network.
# Startup order: mongodb-demo (healthy) -> demo-seed (completes) -> gateway-demo (healthy)
# -> chat-service-demo, dashboard-demo.
name: ownhelp_client_training

services:
  # Local MongoDB Atlas (mongod + mongot) so $vectorSearch works without an Atlas account.
  # Credentials are local-only defaults; setup.sh generates a random password in .env.local.
  mongodb-demo:
    image: mongodb/mongodb-atlas-local:8.0
    restart: unless-stopped
    ports:
      # Host port DEMO_MONGO_PORT (default 27018) avoids clashing with a standard MongoDB on 27017.
      - "127.0.0.1:${DEMO_MONGO_PORT:-27018}:27017"
    environment:
      MONGODB_INITDB_ROOT_USERNAME: ${DEMO_MONGO_USER:-demo_admin}
      MONGODB_INITDB_ROOT_PASSWORD: ${DEMO_MONGO_PASSWORD:-demo_local_only_password}
      DO_NOT_TRACK: "1"
    volumes:
      # Documents and vectors (mongod) and the search index data (mongot). Removed by `setup.sh reset`.
      - demo_mongodb_data:/data/db
      - demo_mongot_data:/data/mongot
    healthcheck:
      # The image's own `runner healthcheck` reports ready only once both mongod and mongot are up.
      test: ["CMD", "runner", "healthcheck"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s
    networks:
      - demo_net

  # One-shot job (no restart, no ports): runs examples/client-training/scripts/seed.py --execute
  # to idempotently insert the presets, sample tickets, documents and vectors, then exits.
  # Reuses the locally built gateway image (built by gateway-demo, hence pull_policy: never).
  # gateway-demo waits for it to complete successfully.
  demo-seed:
    image: ownhelp-client-training-gateway:local
    pull_policy: never
    working_dir: /app
    depends_on:
      mongodb-demo:
        condition: service_healthy
    environment:
      APP_MODE: preset_training
      MONGODB_URI: ${MONGODB_URI:-mongodb://demo_admin:demo_local_only_password@mongodb-demo:27017/?directConnection=true&authSource=admin}
      MONGODB_DB_NAME: ${MONGODB_DB_NAME:-rag_knowledge_base}
      MONGODB_TRAINING_DB_NAME: ${MONGODB_TRAINING_DB_NAME:-capstone_demo}
      MONGODB_COLLECTION_NAME: ${MONGODB_COLLECTION_NAME:-doc_vectors}
      EMBEDDING_MODEL_NAME: ${EMBEDDING_MODEL_NAME:-BAAI/bge-small-en-v1.5}
      HF_HOME: /cache/huggingface
    volumes:
      # Embedding model cache shared by the seed, gateway and chat service containers.
      - demo_hf_cache:/cache/huggingface
      # Read-only host Hugging Face cache (set by setup.sh) used to skip a model download.
      - ${HOST_HF_CACHE_DIR:-./logs/.hf_cache_empty}:/host_hf_cache:ro
      # Receives seed_summary.json on the host at examples/client-training/logs/.
      - ./logs:/app/logs
    # The command copies the host cache into the volume only when the volume has no model yet,
    # then seeds. `|| true` keeps a copy failure from blocking seeding (the model is downloaded instead).
    command:
      - sh
      - -c
      - >
        if [ -d /host_hf_cache/hub ] && [ ! -d /cache/huggingface/hub ]; then
          cp -rn /host_hf_cache/. /cache/huggingface/ 2>/dev/null || true;
        fi &&
        /opt/venv/bin/python examples/client-training/scripts/seed.py --execute --summary-out /app/logs/seed_summary.json
    networks:
      - demo_net

  # Orchestration gateway (Express API) in preset_training mode; also serves /widget.js.
  # Builds the image that demo-seed and chat-service-demo reuse.
  gateway-demo:
    build:
      context: ../..
      dockerfile: examples/client-training/Dockerfile.gateway
    image: ownhelp-client-training-gateway:local
    restart: unless-stopped
    depends_on:
      mongodb-demo:
        condition: service_healthy
      demo-seed:
        condition: service_completed_successfully
    ports:
      # Host DEMO_GATEWAY_PORT (default 4001) -> container 4000.
      - "127.0.0.1:${DEMO_GATEWAY_PORT:-4001}:4000"
    extra_hosts:
      # Lets the container reach Ollama running on the host on Linux.
      - "host.docker.internal:host-gateway"
    environment:
      PORT: "4000"
      APP_MODE: preset_training
      MONGODB_URI: ${MONGODB_URI:-mongodb://demo_admin:demo_local_only_password@mongodb-demo:27017/?directConnection=true&authSource=admin}
      MONGODB_DB_NAME: ${MONGODB_DB_NAME:-rag_knowledge_base}
      MONGODB_TRAINING_DB_NAME: ${MONGODB_TRAINING_DB_NAME:-capstone_demo}
      MONGODB_COLLECTION_NAME: ${MONGODB_COLLECTION_NAME:-doc_vectors}
      EMBEDDING_MODEL_NAME: ${EMBEDDING_MODEL_NAME:-BAAI/bge-small-en-v1.5}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-ownhelp_demo_session}
      UPLOAD_STAGING_DIR: ${UPLOAD_STAGING_DIR:-/tmp/ownhelp_demo_uploads}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3001,http://127.0.0.1:3001}
      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:3b}
      # Shared secret between the gateway and chat-service-demo on the private network only.
      CHAT_BACKEND_URL: http://chat-service-demo:8100
      CHAT_BACKEND_TOKEN: ${CHAT_BACKEND_TOKEN:-demo_local_only_chat_token}
      # Unset means "reject": tenants need widget_config.allowed_origins (or set this in .env for local dev).
      WIDGET_DEFAULT_ALLOWED_ORIGINS: ${WIDGET_DEFAULT_ALLOWED_ORIGINS:-}
      HF_HOME: /cache/huggingface
    volumes:
      - demo_hf_cache:/cache/huggingface
    healthcheck:
      # Healthy only when /api/health reports status ok with the database and vector index ready.
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/api/health').then(r=>r.json()).then(b=>process.exit(b.status==='ok'&&b.database_ready&&b.vector_index_ready?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - demo_net

  # Internal bridge from the gateway's POST /api/chat to retrieval and Ollama. Not published on the host.
  chat-service-demo:
    image: ownhelp-client-training-gateway:local
    pull_policy: never
    restart: unless-stopped
    working_dir: /app
    depends_on:
      mongodb-demo:
        condition: service_healthy
      gateway-demo:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      MONGODB_URI: ${MONGODB_URI:-mongodb://demo_admin:demo_local_only_password@mongodb-demo:27017/?directConnection=true&authSource=admin}
      # The demo gateway runs in preset_training mode, so tenants and documents live in the training DB.
      MONGODB_DB_NAME: ${MONGODB_TRAINING_DB_NAME:-capstone_demo}
      MONGODB_COLLECTION_NAME: ${MONGODB_COLLECTION_NAME:-doc_vectors}
      EMBEDDING_MODEL_NAME: ${EMBEDDING_MODEL_NAME:-BAAI/bge-small-en-v1.5}
      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:3b}
      CHAT_BACKEND_TOKEN: ${CHAT_BACKEND_TOKEN:-demo_local_only_chat_token}
      HF_HOME: /cache/huggingface
    volumes:
      - demo_hf_cache:/cache/huggingface
    command: ["/opt/venv/bin/python", "scripts/run_chat_service.py", "--host", "0.0.0.0", "--port", "8100"]
    healthcheck:
      # GET /health on the internal port; the long start_period covers embedding model loading.
      test:
        [
          "CMD",
          "/opt/venv/bin/python",
          "-c",
          "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8100/health', timeout=3).status == 200 else 1)"
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - demo_net

  # Management dashboard (Next.js). NEXT_PUBLIC_GATEWAY_URL is baked in at build time, so
  # changing it requires rebuilding the image (`setup.sh setup`). It must be a URL the
  # browser can reach, hence localhost rather than the container name.
  dashboard-demo:
    build:
      context: ../..
      dockerfile: examples/client-training/Dockerfile.dashboard
      args:
        NEXT_PUBLIC_GATEWAY_URL: ${NEXT_PUBLIC_GATEWAY_URL:-http://localhost:4001}
    image: ownhelp-client-training-dashboard:local
    restart: unless-stopped
    depends_on:
      gateway-demo:
        condition: service_healthy
    ports:
      # Host DEMO_DASHBOARD_PORT (default 3001) -> container 3000. Keep it in ALLOWED_ORIGINS.
      - "127.0.0.1:${DEMO_DASHBOARD_PORT:-3001}:3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_GATEWAY_URL: ${NEXT_PUBLIC_GATEWAY_URL:-http://localhost:4001}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/login"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - demo_net

  # Optional bundled Ollama, only started with the "ollama" profile (`setup.sh setup --with-ollama`).
  # CPU-only as written; add GPU access yourself if wanted. Download a model with `setup.sh pull-model`.
  # TODO(sandbox-gpu): this service has no GPU reservation, so it runs on CPU only. Add an opt-in
  # `--with-ollama-gpu` flag in scripts/setup.sh that enables a GPU variant (a compose profile or
  # override carrying the same deploy.resources.reservations.devices block as the standard
  # compose.yaml: driver nvidia, count all, capabilities [gpu]). It must stay opt-in, because an
  # unconditional reservation makes the service fail to start on machines without the NVIDIA
  # Container Toolkit. Fix TODO(setup-args) in setup.sh at the same time.
  ollama-demo:
    image: ollama/ollama:0.5.7
    profiles:
      - ollama
    restart: unless-stopped
    ports:
      # Host DEMO_OLLAMA_PORT (default 11435) avoids clashing with a host Ollama on 11434.
      - "127.0.0.1:${DEMO_OLLAMA_PORT:-11435}:11434"
    volumes:
      # Downloaded models; removed by `setup.sh reset`.
      - demo_ollama_models:/root/.ollama
    networks:
      - demo_net

networks:
  demo_net:
    driver: bridge

volumes:
  demo_mongodb_data:
  demo_mongot_data:
  demo_hf_cache:
  demo_ollama_models:

