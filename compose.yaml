# OwnHelp standard stack: GPU Ollama (local inference), the internal chat service, the gateway
# and the dashboard. The database is YOUR MongoDB Atlas cluster: no database container runs here.
# Inference stays on this machine; documents, embeddings, tickets and businesses are stored in
# your Atlas cluster.
#
#   python scripts/setup_stack.py --model-dir <dir with the GGUF> --model-sha256 <digest>
#   docker compose --env-file .env.compose.local up -d --wait
#
# Details: deployment/README.md.
#
# Startup order: ollama (healthy) -> model-init (one-shot GGUF import) -> chat-service -> gateway
# -> dashboard. The gateway reports healthy only once Atlas is reachable and the vector index
# exists and is queryable. Host ports are bound to 127.0.0.1 only. Required variables use
# ${VAR:?message}, so Compose stops with a clear error if .env.compose.local is incomplete.
name: ownhelp

# Environment shared by chat-service and gateway (merged with <<: *runtime-environment).
x-runtime-environment: &runtime-environment
  MONGODB_URI: ${MONGODB_URI:?Set MONGODB_URI to your Atlas connection string}
  MONGODB_DB_NAME: ${MONGODB_DB_NAME:-rag_knowledge_base}
  MONGODB_COLLECTION_NAME: doc_vectors
  MONGODB_VECTOR_INDEX_NAME: vector_index
  EMBEDDING_MODEL_NAME: BAAI/bge-small-en-v1.5
  HF_HOME: /cache/huggingface
  OLLAMA_HOST: http://ollama:11434
  OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:3b-qlora-hardneg-full01-q4}
  CHAT_BACKEND_TOKEN: ${CHAT_BACKEND_TOKEN:?Set CHAT_BACKEND_TOKEN}
  MONGODB_SERVER_SELECTION_TIMEOUT_MS: "5000"
  TOKENIZERS_PARALLELISM: "false"

services:
  # Local inference engine. Requires an NVIDIA GPU, the NVIDIA driver and the NVIDIA Container
  # Toolkit on the host (the reservation below fails on hosts without them; see deployment/README.md).
  # No published port: reachable only as http://ollama:11434 inside the Compose network.
  # Volume: ollama_models (imported model, persists across restarts).
  # Health check: `ollama list` succeeds once the server is up.
  ollama:
    image: ${OLLAMA_IMAGE:-ollama/ollama:0.40.16}
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_NO_CLOUD: "1"
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 30

  # One-shot job (restart: "no"): verifies the host GGUF against MODEL_GGUF_SHA256, then runs
  # `ollama create` from deployment/ollama/Modelfile into the shared ollama_models volume.
  # Exits 0 immediately on later runs when the same GGUF, Modelfile and model are already present.
  # The GGUF, Modelfile and scripts/import_model.sh are bind-mounted read-only; the host file is
  # never modified. chat-service waits for this job to complete successfully.
  model-init:
    image: ${OLLAMA_IMAGE:-ollama/ollama:0.40.16}
    restart: "no"
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:3b-qlora-hardneg-full01-q4}
      MODEL_GGUF_SHA256: ${MODEL_GGUF_SHA256:?Set MODEL_GGUF_SHA256}
    entrypoint: ["/bin/sh", "/setup/import_model.sh"]
    volumes:
      - ollama_models:/root/.ollama
      - type: bind
        source: ${MODEL_GGUF_DIR:?Set MODEL_GGUF_DIR}/Llama-3.2-3B-Instruct.Q4_K_M.gguf
        target: /model-import/Llama-3.2-3B-Instruct.Q4_K_M.gguf
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./deployment/ollama/Modelfile
        target: /model-import/Modelfile
        read_only: true
      - type: bind
        source: ./scripts/import_model.sh
        target: /setup/import_model.sh
        read_only: true

  # Internal chat service (scripts/run_chat_service.py): retrieval from your Atlas cluster, prompt
  # assembly and generation through Ollama. Listens on 8100, not published to the host; only the
  # gateway calls it, authenticated with CHAT_BACKEND_TOKEN. Uses the image built by the gateway
  # service (pull_policy: never), so build the stack once with `docker compose build` or `up`.
  # Volume: hf_cache (embedding model cache). Health check: GET /health on 8100.
  chat-service:
    image: ownhelp-runtime:local
    pull_policy: never
    restart: unless-stopped
    working_dir: /app
    command: ["/opt/venv/bin/python", "scripts/run_chat_service.py", "--host", "0.0.0.0", "--port", "8100"]
    depends_on:
      model-init:
        condition: service_completed_successfully
    environment:
      <<: *runtime-environment
    volumes:
      - hf_cache:/cache/huggingface
    healthcheck:
      test: ["CMD", "/opt/venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/health', timeout=3).close()"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 60s

  # Orchestration Gateway (Node, APP_MODE=standard): POST /api/chat, widget.js and the dashboard
  # API. Also builds the shared runtime image (ownhelp-runtime:local) that includes the Python
  # environment used for document ingestion. Published at 127.0.0.1:${GATEWAY_PORT:-4002}
  # (container port 4000). Health check: /api/health must report the database, vector index and
  # Ollama model as ready. On a new Atlas database the gateway creates the vector index itself
  # (if the Atlas user may create search indexes); Atlas then builds it, which can take a minute
  # or two, and the health check keeps failing until the index is queryable.
  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile.standard
    image: ownhelp-runtime:local
    restart: unless-stopped
    depends_on:
      chat-service:
        condition: service_healthy
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-4002}:4000"
    environment:
      <<: *runtime-environment
      APP_MODE: standard
      PORT: "4000"
      CHAT_BACKEND_URL: http://chat-service:8100
      CHAT_FOLLOW_UP_SECRET: ${CHAT_FOLLOW_UP_SECRET:?Set CHAT_FOLLOW_UP_SECRET}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3002,http://127.0.0.1:3002}
      # Number of reverse proxies in front of the gateway (1 behind a Cloudflare Tunnel) so
      # rate limits see the real client IP. Empty leaves Express's trust proxy off.
      TRUST_PROXY: ${TRUST_PROXY:-}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-ownhelp_session}
      UPLOAD_STAGING_DIR: /tmp/ownhelp_uploads
      PYTHON_EXECUTABLE: /opt/venv/bin/python
    volumes:
      - hf_cache:/cache/huggingface
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/health').then(r=>r.json()).then(b=>process.exit(b.app_mode==='standard'&&b.database_ready&&b.vector_index_ready&&b.ollama_ready?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 30s

  # Management dashboard (Next.js). Published at 127.0.0.1:${DASHBOARD_PORT:-3002} (container
  # port 3000). NEXT_PUBLIC_GATEWAY_URL is baked in at build time and must be the gateway address
  # as seen from the browser. Health check: the /login page responds.
  dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile.standard
      args:
        NEXT_PUBLIC_GATEWAY_URL: ${NEXT_PUBLIC_GATEWAY_URL:-http://localhost:4002}
    restart: unless-stopped
    depends_on:
      gateway:
        condition: service_healthy
    ports:
      - "127.0.0.1:${DASHBOARD_PORT:-3002}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 30

# Named volumes survive `docker compose down`; add -v only to delete all data on purpose.
# Documents, vectors and tickets are in Atlas, so `down -v` does not delete them.
volumes:
  ollama_models:
  hf_cache:
