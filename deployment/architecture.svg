<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Arial, Helvetica, sans-serif">
    <title>OwnHelp standard stack architecture</title>
    <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
        </marker>
    </defs>
    <rect width="960" height="560" fill="#f8fafc"/>
    <text x="480" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">OwnHelp standard stack (compose.yaml)</text>

    <!-- Docker host boundary -->
    <rect x="250" y="55" width="690" height="400" rx="12" fill="#eef2f7" stroke="#64748b" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="264" y="76" font-size="13" fill="#334155">Your server: Docker Compose network (host ports bound to 127.0.0.1 only)</text>

    <!-- Storefront widget -->
    <rect x="20" y="130" width="200" height="110" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
    <text x="120" y="158" text-anchor="middle" font-size="15" font-weight="bold" fill="#0f172a">Storefront chat widget</text>
    <text x="120" y="180" text-anchor="middle" font-size="12" fill="#1e293b">Embedded in the shop page</text>
    <text x="120" y="198" text-anchor="middle" font-size="12" fill="#1e293b">(shadow-root, widget.js)</text>
    <text x="120" y="220" text-anchor="middle" font-size="12" fill="#1e293b">Talks only to the gateway</text>

    <!-- Dashboard -->
    <rect x="20" y="330" width="200" height="110" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
    <text x="120" y="358" text-anchor="middle" font-size="15" font-weight="bold" fill="#0f172a">Dashboard (Next.js)</text>
    <text x="120" y="380" text-anchor="middle" font-size="12" fill="#1e293b">Admin browser UI</text>
    <text x="120" y="398" text-anchor="middle" font-size="12" fill="#1e293b">Host port 127.0.0.1:3002</text>
    <text x="120" y="416" text-anchor="middle" font-size="12" fill="#1e293b">(container 3000)</text>

    <!-- Gateway -->
    <rect x="290" y="210" width="210" height="150" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
    <text x="395" y="238" text-anchor="middle" font-size="15" font-weight="bold" fill="#0f172a">Orchestration Gateway</text>
    <text x="395" y="258" text-anchor="middle" font-size="12" fill="#1e293b">Node, APP_MODE=standard</text>
    <text x="395" y="280" text-anchor="middle" font-size="12" fill="#1e293b">Public: POST /api/chat, widget.js</text>
    <text x="395" y="298" text-anchor="middle" font-size="12" fill="#1e293b">Session-authenticated dashboard API</text>
    <text x="395" y="324" text-anchor="middle" font-size="12" font-weight="bold" fill="#14532d">Host port 127.0.0.1:4002</text>
    <text x="395" y="342" text-anchor="middle" font-size="12" fill="#1e293b">(container 4000)</text>

    <!-- Chat service -->
    <rect x="570" y="210" width="190" height="150" rx="8" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/>
    <text x="665" y="238" text-anchor="middle" font-size="15" font-weight="bold" fill="#0f172a">chat-service</text>
    <text x="665" y="258" text-anchor="middle" font-size="12" fill="#1e293b">Python, internal only</text>
    <text x="665" y="280" text-anchor="middle" font-size="12" fill="#1e293b">Retrieval + prompt assembly</text>
    <text x="665" y="298" text-anchor="middle" font-size="12" fill="#1e293b">+ generation</text>
    <text x="665" y="324" text-anchor="middle" font-size="12" font-weight="bold" fill="#4c1d95">No host port (8100)</text>

    <!-- Ollama -->
    <rect x="720" y="100" width="200" height="90" rx="8" fill="#fce7f3" stroke="#be185d" stroke-width="2"/>
    <text x="820" y="128" text-anchor="middle" font-size="15" font-weight="bold" fill="#0f172a">Ollama</text>
    <text x="820" y="148" text-anchor="middle" font-size="12" fill="#1e293b">Local GPU inference (GGUF)</text>
    <text x="820" y="170" text-anchor="middle" font-size="12" font-weight="bold" fill="#831843">No host port (11434)</text>

    <!-- Atlas -->
    <rect x="620" y="480" width="320" height="64" rx="8" fill="#e2e8f0" stroke="#0f172a" stroke-width="2"/>
    <text x="780" y="504" text-anchor="middle" font-size="15" font-weight="bold" fill="#0f172a">MongoDB Atlas (your cluster, off-host)</text>
    <text x="780" y="524" text-anchor="middle" font-size="12" fill="#1e293b">doc_vectors, businesses, ticket_logs, admin_*</text>

    <!-- Arrows -->
    <line x1="220" y1="185" x2="288" y2="250" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="226" y="205" font-size="12" fill="#0f172a">POST /api/chat</text>

    <line x1="220" y1="385" x2="288" y2="330" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="224" y="372" font-size="12" fill="#0f172a">dashboard API</text>

    <line x1="500" y1="285" x2="568" y2="285" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="534" y="272" text-anchor="middle" font-size="11" fill="#0f172a">token auth</text>

    <line x1="720" y1="210" x2="790" y2="192" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="775" y="214" font-size="12" fill="#0f172a">generate</text>

    <!-- chat-service to Atlas -->
    <line x1="700" y1="360" x2="760" y2="478" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="740" y="408" font-size="12" fill="#0f172a">$vectorSearch</text>
    <text x="740" y="424" font-size="12" fill="#0f172a">filter: tenant_id</text>

    <!-- gateway to Atlas -->
    <path d="M395 360 L395 512 L618 512" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="405" y="440" font-size="12" fill="#0f172a">businesses, documents,</text>
    <text x="405" y="456" font-size="12" fill="#0f172a">tickets, admin sessions</text>

    <!-- Legend -->
    <rect x="20" y="480" width="14" height="14" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
    <text x="42" y="492" font-size="12" fill="#0f172a">Publishes a host port (127.0.0.1)</text>
    <rect x="20" y="504" width="14" height="14" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/>
    <text x="42" y="516" font-size="12" fill="#0f172a">Internal to the Compose network</text>
    <text x="20" y="544" font-size="11" fill="#334155">Gateway also calls Ollama only for /api/health readiness.</text>
</svg>
